name: UIKitExample
options:
  bundleIdPrefix: com.sun
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
packages:
  LookInside:
    url: https://github.com/LookInsideApp/LookInside.git
    exactVersion: 2.2.6
targets:
  UIKitExample:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: UIKitExample
    dependencies:
      - package: LookInside
        product: LookinServer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sun.UIKitExample
        PRODUCT_NAME: UIKitExample
        INFOPLIST_FILE: UIKitExample/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
