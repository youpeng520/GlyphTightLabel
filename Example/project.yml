name: GlyphTightLabelDemo
options:
  bundleIdPrefix: com.glyphTight
  deploymentTarget:
    iOS: "15.0"
packages:
  GlyphTightLabel:
    path: ..
  SnapKit:
    url: https://github.com/SnapKit/SnapKit.git
    from: 6.0.0
targets:
  GlyphTightLabelDemo:
    type: application
    platform: iOS
    sources:
      - path: GlyphTightLabelDemo
    resources:
      - path: GlyphTightLabelDemo/Resources
    settings:
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_FILE: GlyphTightLabelDemo/Info.plist
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
      INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
      INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
      INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    dependencies:
      - package: GlyphTightLabel
        product: GlyphTightLabel
      - package: SnapKit
        product: SnapKit
